name: Build RU GeoSite

on:
  workflow_dispatch:

  schedule:
    - cron: "0 3 * * *"
      timezone: "Europe/Moscow"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Checkout domain-list-community
        uses: actions/checkout@v7
        with:
          repository: v2fly/domain-list-community
          path: upstream

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: upstream/go.mod
          cache: false

      - name: Build RU-only geosite.dat
        run: |
          mkdir -p output

          cd upstream
          go run ./ \
            --datprofile=../config.json \
            --outputdir=../output
          cd ..

          test -s output/geosite.dat

          echo "Generated file:"
          ls -lh output/geosite.dat

          cd output
          sha256sum geosite.dat > geosite.dat.sha256

      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATE=$(TZ=Europe/Moscow date +"%Y-%m-%d")
          TITLE="RU GeoSite — $DATE"

          if gh release view ru-latest >/dev/null 2>&1; then
            gh release upload ru-latest \
              output/geosite.dat \
              output/geosite.dat.sha256 \
              --clobber

            gh release edit ru-latest \
              --title "$TITLE"
          else
            gh release create ru-latest \
              output/geosite.dat \
              output/geosite.dat.sha256 \
              --title "$TITLE" \
              --notes "Automatically generated RU-only geosite.dat from v2fly/domain-list-community (category-ru)."
          fi

      - name: Keep repository active
        run: |
          LAST_COMMIT=$(git log -1 --format=%ct)
          NOW=$(date +%s)
          AGE=$((NOW - LAST_COMMIT))

          if [ "$AGE" -ge 2592000 ]; then
            date -u +"%Y-%m-%dT%H:%M:%SZ" > last-update.txt

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add last-update.txt
            git commit -m "chore: keep scheduled workflow active"
            git push
          else
            echo "Repository is active. No keepalive commit needed."
          fi
